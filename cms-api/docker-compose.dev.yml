# Local development dependencies only. Production runs from cms-infra (07-OPS-ARCH).
name: cms-dev

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms-local-only
      POSTGRES_DB: cms
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms -d cms']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
