# SAST for M-SAST-01 and M-SAST-03. Runs per PR and nightly as part of G-09.
name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'

# codeql-action reads its own workflow run, which needs actions: read on a private repository.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
