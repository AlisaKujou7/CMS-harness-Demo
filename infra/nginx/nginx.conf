# Runs as an unprivileged user on a read-only root, so everything it writes goes to /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The path, never the request line: query strings hold the signatures of media URLs.
    log_format json_access escape=json
        '{"time":"$time_iso8601","service":"nginx","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","host":"$host","method":"$request_method","path":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time}';
    access_log /dev/stdout json_access;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's DNS. A name in a variable is looked up again, so a recreated container is found.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Behind the application's own limits (07-OPS-ARCH 16.3), and well above them, so these only
    # stop a flood from one address before it reaches Node.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=300r/s;
    limit_req_status 429;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    include /etc/nginx/conf.d/*.conf;
}
